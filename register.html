<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration Form</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="script.js"></script>
 
</head>
<body>
  <header>
    
  </header>

  <div id="registration">
    <h2>User Registration Form</h2>
    <form id="registrationForm">
      <label for="fullName">Full Name:</label>
      <input type="text" id="fullName" name="fullName" required>
      <span id="fullNameError" class="error"></span>

      <label for="regNumber">Registration Number:</label>
      <input type="text" id="regNumber" name="regNumber" required>
      <span id="regNumberError" class="error"></span>

      <label for="sex">Sex:</label>
      <select id="sex" name="sex" required>
        <option value="">Select</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>
      <span id="emailError" class="error"></span>

      <label for="region">Region:</label>
      <select id="region" name="region" required>
        <option value="">Select Region</option>
        <!-- Regions will be populated dynamically -->
      </select>

      <label for="district">District:</label>
      <select id="district" name="district" required>
        <option value="">Select District</option>
        <!-- Districts will be populated dynamically -->
      </select>

      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required>
      <span id="passwordError" class="error"></span>

      <label for="confirmPassword">Confirm Password:</label>
      <input type="password" id="confirmPassword" name="confirmPassword" required>
      <span id="confirmPasswordError" class="error"></span>

      <button type="submit">Register</button>
    </form>
  </div>

  <footer>
    <p>&copy; 2025 My Company. All rights reserved. | <a href="#">Privacy Policy</a></p>
  </footer>

  <script>
    // Example JavaScript for form validation
    document.getElementById('registrationForm').addEventListener('submit', function (event) {
      let isValid = true;

      // Full Name Validation
      const fullName = document.getElementById('fullName').value.trim();
      if (fullName === '') {
        document.getElementById('fullNameError').textContent = 'Full Name is required.';
        isValid = false;
      } else {
        document.getElementById('fullNameError').textContent = '';
      }

      // Password Validation
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      if (password !== confirmPassword) {
        document.getElementById('confirmPasswordError').textContent = 'Passwords do not match.';
        isValid = false;
      } else {
        document.getElementById('confirmPasswordError').textContent = '';
      }

      if (!isValid) {
        event.preventDefault(); // Prevent form submission if validation fails
      }
    });

    // Example: Populate Regions and Districts (static data for demonstration)
    const regions = [
      { name: 'Region 1', districts: ['District 1A', 'District 1B'] },
      { name: 'Region 2', districts: ['District 2A', 'District 2B'] },
    ];

    const regionSelect = document.getElementById('region');
    const districtSelect = document.getElementById('district');

    regions.forEach(region => {
      const option = document.createElement('option');
      option.value = region.name;
      option.textContent = region.name;
      regionSelect.appendChild(option);
    });

    regionSelect.addEventListener('change', function () {
      const selectedRegion = regions.find(region => region.name === this.value);
      districtSelect.innerHTML = '<option value="">Select District</option>';

      if (selectedRegion) {
        selectedRegion.districts.forEach(district => {
          const option = document.createElement('option');
          option.value = district;
          option.textContent = district;
          districtSelect.appendChild(option);
        });
      }
    });
  </script>
</body>
</html>
