<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration Form</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
 
  <style>
  
    header {
      background: #333;
      padding: 10px 20px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }
    nav ul li {
      position: relative;
      margin: 0 15px;
    }
    nav ul li a {
      color: white;
      text-decoration: none;
      padding: 10px 15px;
      display: block;
      transition: background 0.3s ease;
    }
    nav ul li a:hover {
      background: #555;
      border-radius: 5px;
    }
    .dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #ddd;
      min-width: 150px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      z-index: 1001;
    }
    .dropdown a {
      color: #333;
      padding: 10px;
      display: block;
      transition: background 0.3s ease;
    }
    .dropdown a:hover {
      background: #f0f0f0;
    }
    nav ul li:hover .dropdown {
      display: block;
    }

    /* Carousel Styles */
    .carousel {
      position: relative;
      width: 100%;
      max-width: 1200px;
      margin: 20px auto;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .carousel img {
      width: 100%;
      display: none;
      border-radius: 10px;
    }
    .carousel img.active {
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="register.html">Register</a></li> <!-- Link to register.html -->
        <li><a href="#contact">Contact</a></li>
        <li>
          <a href="#">Service</a>
          <ul class="dropdown">
            <li><a href="#service1">Buy Your Phone</a></li>
            <li><a href="#service2">Phone Service</a></li>
            <li><a href="#service3">Computer Accessories</a></li>
          </ul>
        </li>
      </ul>
    </nav>
  </header>

  <div id="home">
    <div class="carousel">
      <img src="P1.jpg" alt="Image 1" class="active">
      <img src="P2.jpg" alt="Image 2">
      <img src="P3.jpg" alt="Image 3">
    </div>
  </div>

  <script>
    // Simple Carousel Script
    let currentIndex = 0;
    const images = document.querySelectorAll('.carousel img');
    const totalImages = images.length;

    function showNextImage() {
      images[currentIndex].classList.remove('active');
      currentIndex = (currentIndex + 1) % totalImages;
      images[currentIndex].classList.add('active');
    }

    setInterval(showNextImage, 3000); // Change image every 3 seconds
  </script>
</body>
</html>
